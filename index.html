<script>try{var p=JSON.parse(localStorage.getItem("baithak:prefs")||"{}"),d=document.documentElement,k=p.skin||"green";d.dataset.skin=k;d.dataset.look=p.look||"sleek";if(k==="green"&&p.theme&&p.theme!=="auto")d.setAttribute("data-theme",p.theme)}catch(e){document.documentElement.dataset.look="sleek";document.documentElement.dataset.skin="green"}</script>
<link rel="stylesheet" href="css/base.css">

<div id="sheet-root"></div>
